services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
    image: ibrahim-uylas-local:latest
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3333/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped
