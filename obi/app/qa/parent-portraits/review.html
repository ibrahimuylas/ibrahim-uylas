<!doctype html><html lang="en"><meta charset="utf-8"><title>Parent portrait framing review</title><style>body{font:16px Arial;background:#f8fbfe;color:#19314d;padding:30px}main{display:grid;grid-template-columns:repeat(5,150px);gap:25px}.parent-avatar{position:relative;display:block;width:100px;height:100px;overflow:hidden;border-radius:50%;background:#eaf0f4}.parent-avatar img{position:absolute;max-width:none;object-fit:cover}p{max-width:140px;font-size:13px}</style><h1>Parent portraits</h1><main></main><script type="module">
import archive from '/src/data/archive.json';import {parentPortraitStyle} from '/src/parent-portraits.js';import {thumbnailSource} from '/src/image-sources.js';
const parents=new Set(archive.dogs.flatMap(d=>d.parents));
for(const dog of archive.dogs.filter(d=>parents.has(d.id))){const card=document.createElement('article'),avatar=document.createElement('span'),img=document.createElement('img'),name=document.createElement('p');avatar.className='parent-avatar';img.src=thumbnailSource(dog.photos[0].src);Object.assign(img.style,parentPortraitStyle(dog.photos[0]));name.textContent=dog.name;avatar.append(img);card.append(avatar,name);document.querySelector('main').append(card);}
</script></html>
